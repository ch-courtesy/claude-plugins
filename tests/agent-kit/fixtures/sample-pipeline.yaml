# 표준 파이프라인 픽스처 — 라이브러리 참조·유틸·인라인 3형태와 참조 문법 예시
name: greet-report
description: 이름 목록에 인사하고 승인 후 저장
inputs:
  names: {type: array, required: true}
nodes:
  - id: each
    util: foreach
    items: $pipeline.names
    node: greet
    in: {name: $item}
  - id: combine
    util: transform
    in: {items: $each.results}
    expr: '{lines: [.items[].greeting]}'
  - id: gate
    util: human-gate
    message: "{{count}}건 저장할까요?"
    in: {count: $pipeline.names}
  - id: save
    inline:
      kind: script
      inputs: {lines: {type: array, required: true}}
      outputs: {ok: {type: boolean}}
      run: {command: "jq -c '{ok: (.lines | length > 0)}'", input: stdin-json, output: stdout-json}
    in: {lines: $combine.lines}
    needs: [gate]
    retry: 1
    on_error: continue
